name: Supabase deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'shared/**'
      - 'scripts/sync-shared.mjs'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Edge function tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: shared-kopie actueel?
        run: node scripts/sync-shared.mjs --check
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno check + test
        working-directory: supabase/functions
        run: |
          deno check submit-aanvraag/index.ts
          deno test --allow-env --allow-net=none submit-aanvraag/

  deploy:
    name: Migraties, functions en secrets
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets aanwezig?
        run: |
          missing=()
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing+=(SUPABASE_ACCESS_TOKEN)
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing+=(SUPABASE_DB_PASSWORD)
          [ -z "$PROJECT_ID" ] && missing+=(SUPABASE_PROJECT_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Ontbrekende repository secrets: ${missing[*]} (Settings → Secrets and variables → Actions)"
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Project koppelen
        run: supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Migraties toepassen
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Edge functions deployen
        run: supabase functions deploy submit-aanvraag --project-ref "$PROJECT_ID" --use-api
      - name: Function-secrets zetten (alleen ingevulde)
        env:
          ASANA_PAT: ${{ secrets.ASANA_PAT }}
          ASANA_PROJECT_GID: ${{ secrets.ASANA_PROJECT_GID }}
          ASANA_ASSIGNEE_GID: ${{ secrets.ASANA_ASSIGNEE_GID }}
          ROUTINE_FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          ROUTINE_TOKEN: ${{ secrets.ROUTINE_TOKEN }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          RATE_SALT: ${{ secrets.RATE_SALT }}
        run: |
          args=()
          for k in ASANA_PAT ASANA_PROJECT_GID ASANA_ASSIGNEE_GID ROUTINE_FIRE_URL ROUTINE_TOKEN ALLOWED_ORIGINS RATE_SALT; do
            v="${!k}"
            if [ -n "$v" ]; then args+=("$k=$v"); echo "  zet $k"; else echo "  overslaan $k (leeg)"; fi
          done
          if [ ${#args[@]} -gt 0 ]; then
            supabase secrets set --project-ref "$PROJECT_ID" "${args[@]}"
          fi
      - name: Samenvatting
        run: |
          {
            echo "### Supabase deploy gelukt"
            echo
            echo "- Function: \`https://${PROJECT_ID}.supabase.co/functions/v1/submit-aanvraag\`"
            echo "- Migraties: \`$(ls supabase/migrations | tr '\n' ' ')\`"
          } >> "$GITHUB_STEP_SUMMARY"
