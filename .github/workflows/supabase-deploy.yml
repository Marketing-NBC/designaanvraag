name: Supabase deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'shared/**'
      - 'scripts/sync-shared.mjs'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Edge function tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: shared-kopie actueel?
        run: node scripts/sync-shared.mjs --check
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno check + test
        working-directory: supabase/functions
        run: |
          deno check submit-aanvraag/index.ts aanvraag-status/index.ts asana-webhook/index.ts aanvraag-zoeken/index.ts aanvulling-toevoegen/index.ts
          deno test --allow-env --allow-net=none _shared/ submit-aanvraag/ aanvraag-status/ asana-webhook/ aanvraag-zoeken/ aanvulling-toevoegen/

  deploy:
    name: Migraties, functions en secrets
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Secrets aanwezig?
        run: |
          missing=()
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing+=(SUPABASE_ACCESS_TOKEN)
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing+=(SUPABASE_DB_PASSWORD)
          [ -z "$PROJECT_ID" ] && missing+=(SUPABASE_PROJECT_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Ontbrekende repository secrets: ${missing[*]} (Settings → Secrets and variables → Actions)"
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Project koppelen
        run: supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Migraties toepassen
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Edge functions deployen
        run: supabase functions deploy --project-ref "$PROJECT_ID" --use-api
      - name: Function-secrets zetten (alleen ingevulde)
        env:
          ASANA_PAT: ${{ secrets.ASANA_PAT }}
          SB_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ASANA_PROJECT_GID: ${{ secrets.ASANA_PROJECT_GID }}
          ASANA_ASSIGNEE_GID: ${{ secrets.ASANA_ASSIGNEE_GID }}
          ASANA_PLANNING_PROJECT_GID: ${{ secrets.ASANA_PLANNING_PROJECT_GID }}
          ROUTINE_FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          ROUTINE_TOKEN: ${{ secrets.ROUTINE_TOKEN }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          RATE_SALT: ${{ secrets.RATE_SALT }}
        run: |
          args=()
          for k in ASANA_PAT SB_SECRET_KEY ASANA_PROJECT_GID ASANA_ASSIGNEE_GID ASANA_PLANNING_PROJECT_GID ROUTINE_FIRE_URL ROUTINE_TOKEN ALLOWED_ORIGINS RATE_SALT; do
            v="${!k}"
            if [ -n "$v" ]; then args+=("$k=$v"); echo "  zet $k"; else echo "  overslaan $k (leeg)"; fi
          done
          if [ ${#args[@]} -gt 0 ]; then
            supabase secrets set --project-ref "$PROJECT_ID" "${args[@]}"
          fi
      - name: Asana-webhook koppelen (planning-flow)
        env:
          ASANA_PAT: ${{ secrets.ASANA_PAT }}
        run: |
          if [ -z "$ASANA_PAT" ]; then echo "ASANA_PAT leeg; webhook overgeslagen"; exit 0; fi
          node scripts/asana-webhook.mjs --target "https://${PROJECT_ID}.supabase.co/functions/v1/asana-webhook" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Samenvatting
        run: |
          {
            echo "### Supabase deploy gelukt"
            echo
            echo "- Functions: \`https://${PROJECT_ID}.supabase.co/functions/v1/submit-aanvraag\`, \`…/aanvraag-status\` en \`…/asana-webhook\`"
            echo "- Migraties: \`$(ls supabase/migrations | tr '\n' ' ')\`"
          } >> "$GITHUB_STEP_SUMMARY"
