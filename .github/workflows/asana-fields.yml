name: Asana-velden vernieuwen

# Leest het Asana-project van Marketing uit (custom fields, opties, assignee) en commit shared/asana-fields.json.
# Draai dit na het aanmaken/hernoemen van velden in Asana. Vereist secret ASANA_PAT.

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Link of GID van het Asana-project van Marketing'
        required: true
      assignee:
        description: 'Naam van de designer zoals in Asana (voor de assignee-gid)'
        required: false
        default: 'Abel'
      planning:
        description: 'Link of GID van het planningsproject (taken komen daar ook in zodra er een vervaldatum staat)'
        required: false
        default: 'https://app.asana.com/1/1205781972079586/project/1206998483284471'

permissions:
  contents: write
  # Om de Supabase-deploy zelf te kunnen starten; zie de laatste stap.
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      ASANA_PAT: ${{ secrets.ASANA_PAT }}
      PROJECT_INPUT: ${{ inputs.project }}
      ASSIGNEE_INPUT: ${{ inputs.assignee }}
      PLANNING_INPUT: ${{ inputs.planning }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Velden uitlezen
        run: |
          [ -n "$ASANA_PAT" ] || { echo "::error::Secret ASANA_PAT ontbreekt"; exit 1; }
          node scripts/asana-fields.mjs --project "$PROJECT_INPUT" --assignee "$ASSIGNEE_INPUT" --planning "$PLANNING_INPUT" | tee -a "$GITHUB_STEP_SUMMARY"
          node scripts/sync-shared.mjs
      - name: Committen
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/asana-fields.json supabase/functions/_shared/shared/asana-fields.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
            echo "gewijzigd=false" >> "$GITHUB_OUTPUT"
          else
            echo "gewijzigd=true" >> "$GITHUB_OUTPUT"
            git commit -m "Asana-velden vernieuwd via workflow"
            git push
          fi
      # Een push door github-actions[bot] start géén workflows — dat voorkomt eindeloze kettingen,
      # maar het betekent ook dat de zojuist gecommitte veld-gids nooit bij de edge functions komen.
      # Die stonden dan met een oude configuratie te draaien zonder dat iemand het merkte. Vandaar
      # dat we de deploy hier zelf aanzwengelen.
      - name: Supabase-deploy starten
        if: steps.commit.outputs.gewijzigd == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run supabase-deploy.yml --ref main
          echo "Supabase-deploy gestart met de nieuwe veldconfiguratie." >> "$GITHUB_STEP_SUMMARY"
