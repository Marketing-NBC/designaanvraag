name: Weekmail

# Elke maandagochtend het weekoverzicht van de designaanvragen: de deadlines van deze week en waar
# Marketing op moet letten, per locatie naar het eigen marketingpostvak. Zie scripts/weekmail.mjs.
# Vereist secrets ASANA_PAT, MS_TENANT_ID, MS_CLIENT_ID en MS_CLIENT_SECRET.

on:
  schedule:
    # 8:00 Nederlandse tijd. GitHub kent alleen UTC, dus twee tijden: 06:00 UTC is 8:00 in de
    # zomer, 07:00 UTC is 8:00 in de winter. De eerste stap laat alleen de juiste doorgaan.
    # GitHub start een geplande run soms een kwartier of meer later.
    - cron: '0 6 * * 1'
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      aan:
        description: 'Naar dit adres in plaats van de marketingpostvakken (om te testen). Leeg = normaal.'
        type: string
        required: false
        default: ''
      proef:
        description: 'Niets versturen, alleen laten zien wat er in zou staan'
        type: boolean
        required: false
        default: false

concurrency:
  group: weekmail
  cancel-in-progress: false

jobs:
  weekmail:
    runs-on: ubuntu-latest
    env:
      ASANA_PAT: ${{ secrets.ASANA_PAT }}
      ASANA_PROJECT_GID: ${{ secrets.ASANA_PROJECT_GID }}
      MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
      MAIL_AFZENDER: ${{ vars.MAIL_AFZENDER }}
    steps:
      - name: Is het 8:00 in Nederland?
        id: tijd
        if: github.event_name == 'schedule'
        env:
          SCHEMA: ${{ github.event.schedule }}
        run: |
          # +0200 is zomertijd, dan hoort de run van 06:00 UTC erbij; +0100 is wintertijd: 07:00 UTC.
          if [ "$(TZ=Europe/Amsterdam date +%z)" = "+0200" ]; then juist='0 6 * * 1'; else juist='0 7 * * 1'; fi
          if [ "$SCHEMA" = "$juist" ]; then echo "door=true" >> "$GITHUB_OUTPUT"; else echo "door=false" >> "$GITHUB_OUTPUT"; echo "Niet de 8:00-run van dit seizoen; overgeslagen."; fi
      - uses: actions/checkout@v4
        if: steps.tijd.outputs.door != 'false'
      - uses: actions/setup-node@v4
        if: steps.tijd.outputs.door != 'false'
        with:
          node-version: 22
      - name: Weekoverzicht versturen
        if: steps.tijd.outputs.door != 'false'
        env:
          AAN: ${{ inputs.aan }}
          PROEF: ${{ inputs.proef }}
        run: |
          args=()
          [ -n "$AAN" ] && args+=(--aan "$AAN")
          [ "$PROEF" = "true" ] && args+=(--proef)
          node --experimental-strip-types --no-warnings scripts/weekmail.mjs "${args[@]}"
      - name: Proefmails bewaren
        if: inputs.proef
        uses: actions/upload-artifact@v4
        with:
          name: weekmail-proef
          path: weekmail-proef/
