# Supabase CLI-config. Alleen de instellingen die voor dit project afwijken van de defaults.
# De rest (lokale poorten, auth, studio) is niet in gebruik: we deployen alleen naar het gelinkte project.
project_id = "designaanvraag"

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# Het formulier stuurt de publishable key in de `apikey`-header; er is geen ingelogde gebruiker,
# dus JWT-verificatie staat uit. De function valideert zelf (schema, honeypot, rate-limit).
[functions.submit-aanvraag]
enabled = true
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/submit-aanvraag/index.ts"

[functions.aanvraag-status]
enabled = true
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/aanvraag-status/index.ts"

# Asana roept deze aan (webhook); auth via token in de URL plus HMAC-handtekening van Asana.
[functions.asana-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/asana-webhook/index.ts"

# Zoeken op eventnaam om een eerdere aanvraag terug te vinden. Alleen lezen, eigen uurlimiet.
[functions.aanvraag-zoeken]
enabled = true
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/aanvraag-zoeken/index.ts"

# Aanvulling op een bestaande aanvraag: reactie onder de Asana-taak plus een paar velden bijwerken.
[functions.aanvulling-toevoegen]
enabled = true
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/aanvulling-toevoegen/index.ts"

# Geeft tijdelijke uploadlinks uit; de browser uploadt daarna rechtstreeks naar Storage.
[functions.bijlage-uploadlink]
enabled = true
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/bijlage-uploadlink/index.ts"

# De repository NBC-3D-ledkolom-Preview haalt hier op welke ledkolomvideo's een 3D-preview moeten
# worden, en meldt terug als ze online staan. Auth via het gedeelde geheim LEDKOLOM_SECRET.
[functions.ledkolom-preview]
enabled = true
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/ledkolom-preview/index.ts"
