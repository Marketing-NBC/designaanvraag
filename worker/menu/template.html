<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Menuscherm</title>
<style>
  /* Fonts worden door render.mjs als data-URI ingevoegd (about:blank mag geen file:// laden). */
  @font-face { font-family: 'Pockota'; src: url('{{FONT_DIR}}/Pockota-Light.otf') format('opentype'); font-weight: 300; }
  @font-face { font-family: 'Pockota'; src: url('{{FONT_DIR}}/Pockota-Regular.otf') format('opentype'); font-weight: 400; }
  @font-face { font-family: 'Pockota'; src: url('{{FONT_DIR}}/Pockota-Medium.otf') format('opentype'); font-weight: 500; }
  @font-face { font-family: 'Area Normal'; src: url('{{FONT_DIR}}/AreaNormal-Regular.otf') format('opentype'); font-weight: 400; }
  @font-face { font-family: 'Area Normal'; src: url('{{FONT_DIR}}/AreaNormal-Semibold.otf') format('opentype'); font-weight: 600; }
  @font-face { font-family: 'Area Normal'; src: url('{{FONT_DIR}}/AreaNormal-Extrabold.otf') format('opentype'); font-weight: 800; }

  :root {
    /* Merk-tokens: standaard NBC-huisstijl, worden per event overschreven
       (blob-top/bottom + accent uit de huisstijl-extractie, logo uit de rode balk).
       Alle maten zijn artboard-coordinaten (3840x2160) gedeeld door 2 -> 1920x1080.
       Bij deviceScaleFactor 2 rendert dat exact 1:1 op het .ai-bestand. */
    --blob-top: #f6a107;
    --blob-bottom: #229d96;
    --accent: #f6a107;
    --ink: #000000;
    --dish: #000000;
    --ingredients: #000000;
    --paper: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1920px; height: 1080px; background: var(--paper);
    font-family: 'Area Normal', Inter, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
    overflow: hidden;
  }
  .scherm { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

  /* Decoratieve blobs (merk-gekleurd) — exacte vormen uit het Illustrator-bestand. */
  .blobs { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; }

  /* Titel linksboven — Pockota Medium 199.5/2 = 99.75px. */
  .titel {
    position: absolute; left: 129.6px; top: 98px;
    font-family: 'Pockota', Georgia, serif; font-weight: 500;
    font-size: 99.75px; line-height: 1; color: var(--ink); letter-spacing: 0;
  }

  /* Logo-balk opdrachtgever (rechtsboven) — rect 2075.8,74.3 791.4x297 -> /2. */
  .logo-balk {
    position: absolute; left: 1037.9px; top: 37.15px; width: 395.7px; height: 148.5px;
    background: #ff0000; display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .logo-balk .placeholder { font-weight: 800; font-size: 28.5px; color: #000000; }
  .logo-balk img { max-width: 88%; max-height: 82%; object-fit: contain; }

  /* Kolommen — absoluut geplaatst op de exacte x/y uit het .ai-bestand (via data.layout). */
  .kolommen { position: absolute; }
  .kolom { position: absolute; top: 0; display: flex; flex-direction: column; gap: 27.5px; }
  .sectie-kop {
    font-family: 'Pockota', Georgia, serif; font-weight: 500;
    font-size: 39.6px; line-height: 1.0; color: var(--accent); margin: -7px 0 45.7px;
  }
  .gerecht { margin-bottom: 23.75px; }
  .gerecht:last-child { margin-bottom: 0; }
  .gerecht .naam {
    font-family: 'Area Normal', sans-serif; font-weight: 800;
    font-size: 30.8px; line-height: 1.0; color: var(--dish); margin-bottom: 7.5px;
  }
  .gerecht .naam .tag { font-weight: 800; }
  .gerecht .ingredienten {
    font-family: 'Area Normal', sans-serif; font-weight: 400;
    font-size: 20.9px; line-height: 27.5px; color: var(--ingredients);
  }

  /* Voetregel: dieetwens/allergie — icoon 2038.8,1815.4 + tekst 2442.8,1811.9 -> /2. */
  .voet {
    position: absolute; left: 1019.4px; top: 918.45px;
    display: flex; align-items: flex-start; gap: 44.8px;
  }
  .voet .icoon { flex: none; }
  .voet .tekst .kop {
    font-family: 'Area Normal', sans-serif; font-weight: 800;
    font-size: 26.95px; line-height: 1.0; color: #1d1d1b; margin-bottom: 9px;
  }
  .voet .tekst .sub {
    font-family: 'Area Normal', sans-serif; font-weight: 400;
    font-size: 21.65px; line-height: 26.5px; color: #1d1d1b;
  }
</style>
</head>
<body>
<div class="scherm" id="scherm">
  <!-- Blobs: exacte vormen uit het .ai-bestand, gevuld met één diagonale merk-gradient
       (oranje rechtsboven -> teal linksonder). Herkleurbaar via --blob-top/--blob-bottom. -->
  <svg class="blobs" viewBox="0 0 3840 2160" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Rechter blob: verticaal, oranje boven -> teal onder (zoals in het .ai). -->
      <linearGradient id="blobgrad-r" gradientUnits="userSpaceOnUse" x1="3463" y1="40" x2="3463" y2="2160">
        <stop offset="0" stop-color="var(--blob-top)"/>
        <stop offset="1" stop-color="var(--blob-bottom)"/>
      </linearGradient>
      <!-- Linksonder blob: teal linksboven -> oranje rechtsonder. -->
      <linearGradient id="blobgrad-l" gradientUnits="userSpaceOnUse" x1="0" y1="1460" x2="1371" y2="2160">
        <stop offset="0" stop-color="var(--blob-bottom)"/>
        <stop offset="1" stop-color="var(--blob-top)"/>
      </linearGradient>
    </defs>

    <path fill="url(#blobgrad-l)" d="M 0 1469.819 V 2160 H 1371.842 C 1222.791 2017.433 1029.7 1790.42 808.864 1800.34 580.815 1810.589 448.367 1984.546 346.57 1641.615 307.801 1547.591 218.029 1478.713 117.895 1463.53 104.047 1461.509 89.773 1460.495 75.349 1460.495 50.168 1460.495 24.55 1463.586 0 1469.819 Z"/>
  </svg>

  <div class="titel" id="titel"></div>

  <div class="logo-balk" id="logoBalk">
    <span class="placeholder">Logo opdrachtgever</span>
  </div>

  <div class="kolommen" id="kolommen"></div>

  <div class="voet">
    <svg class="icoon" width="157.2" height="102.1" viewBox="0 0 314.38 204.21" fill="var(--accent)" xmlns="http://www.w3.org/2000/svg">
      <path d="M314.37 12.06 C314.37 11.92 314.37 11.79 314.36 11.65 C314.04 7.12 311.42 3.29 307.50 1.66 C303.55 0.00 299.03 0.80 295.42 3.79 C285.55 11.98 279.00 37.46 276.65 48.02 C271.89 69.41 269.58 85.80 283.21 100.11 L283.21 189.61 C283.21 197.52 290.30 204.21 298.71 204.21 C307.19 204.21 314.38 197.61 314.38 189.80 L314.38 103.08 L314.38 103.02 L314.38 102.97 L314.37 12.06 M301.93 103.02 L301.93 103.08 L301.93 189.80 C301.93 190.53 300.47 191.96 298.71 191.96 C297.08 191.96 295.66 190.50 295.66 189.61 L295.66 97.73 C295.66 96.29 295.14 94.97 294.29 93.93 C293.97 93.48 293.62 93.07 293.24 92.69 C283.61 83.34 283.71 73.55 288.80 50.65 C291.88 36.86 297.09 21.17 301.92 14.86 L301.93 102.97 L301.93 103.02"/>
      <path d="M40.02 0.69 L39.10 0.69 C18.26 0.69 7.15 23.58 3.96 43.30 C0.00 67.80 11.02 84.24 24.15 90.58 L24.15 189.91 C24.15 197.74 31.14 204.11 39.74 204.11 C48.34 204.11 55.34 197.74 55.34 189.91 L55.34 90.34 C72.64 81.92 77.76 60.67 74.96 43.30 C71.77 23.58 60.67 0.69 40.02 0.69 M47.14 80.44 C44.60 81.28 42.89 83.61 42.89 86.25 L42.89 189.91 C42.89 190.81 41.52 191.86 39.74 191.86 C37.97 191.86 36.60 190.81 36.60 189.91 L36.60 86.44 C36.60 83.76 34.82 81.39 32.21 80.59 C18.65 76.47 13.92 59.68 16.25 45.22 C18.19 33.20 25.20 12.94 39.33 12.94 L39.80 12.94 C53.72 12.94 60.72 33.20 62.66 45.22 C64.96 59.44 60.37 76.09 47.14 80.44"/>
      <path d="M170.77 18.03 C123.27 18.03 84.64 56.05 84.64 102.78 C84.64 149.51 123.27 187.53 170.77 187.53 C218.27 187.53 256.91 149.51 256.91 102.78 C256.91 56.05 218.27 18.03 170.77 18.03 M170.77 175.28 C130.14 175.28 97.08 142.76 97.08 102.78 C97.08 62.80 130.14 30.28 170.77 30.28 C211.41 30.28 244.46 62.80 244.46 102.78 C244.46 142.76 211.41 175.28 170.77 175.28"/>
      <path d="M170.77 141.41 C166.97 141.41 163.87 144.46 163.87 148.20 C163.87 151.95 166.97 155.00 170.77 155.00 C174.58 155.00 177.68 151.95 177.68 148.20 C177.68 144.46 174.58 141.41 170.77 141.41"/>
      <path d="M170.77 135.66 C174.20 135.66 177.00 132.92 177.00 129.54 L177.00 54.87 C177.00 51.50 174.20 48.75 170.77 48.75 C167.34 48.75 164.54 51.50 164.54 54.87 L164.54 129.54 C164.54 132.92 167.34 135.66 170.77 135.66"/>
    </svg>
    <div class="tekst">
      <div class="kop">Dieetswens of allergie?</div>
      <div class="sub">Laat het ons team weten,<br>we helpen je graag.</div>
    </div>
  </div>
</div>

<script>
  // De data wordt door render.mjs ingevoegd als window.__MENU__.
  const data = window.__MENU__ || { title: '', columns: [] };

  document.getElementById('titel').textContent = data.title || '';

  const root = document.getElementById('scherm');
  if (data.brand) {
    const b = data.brand;
    if (b.blobTop)    root.style.setProperty('--blob-top', b.blobTop);
    if (b.blobBottom) root.style.setProperty('--blob-bottom', b.blobBottom);
    if (b.accent)     root.style.setProperty('--accent', b.accent);
    if (b.logo) {
      const balk = document.getElementById('logoBalk');
      balk.innerHTML = '';
      balk.style.background = b.logoBg || '#ffffff';
      const img = document.createElement('img');
      img.src = b.logo;
      balk.appendChild(img);
    }
  }

  const cols = document.getElementById('kolommen');
  // Layout (exacte geometrie uit het .ai-bestand); valt terug op een gelijkmatige verdeling.
  const layout = data.layout || {};
  const n = (data.columns || []).length || 1;
  cols.style.left = (layout.marginLeft ?? 130) + 'px';
  cols.style.top = (layout.top ?? 273) + 'px';
  data.columns.forEach((sections, ci) => {
    const kolom = document.createElement('div');
    kolom.className = 'kolom';
    const c = (layout.columns && layout.columns[ci]) || { left: ci * 560, width: 430 };
    kolom.style.left = c.left + 'px';
    kolom.style.width = c.width + 'px';
    for (const sectie of sections) {
      const blok = document.createElement('div');
      const kop = document.createElement('div');
      kop.className = 'sectie-kop';
      kop.textContent = sectie.heading;
      blok.appendChild(kop);
      for (const item of (sectie.items || [])) {
        const g = document.createElement('div');
        g.className = 'gerecht';
        const naam = document.createElement('div');
        naam.className = 'naam';
        naam.textContent = item.name;
        if (item.tag) {
          const t = document.createElement('span');
          t.className = 'tag';
          t.textContent = ' (' + item.tag + ')';
          naam.appendChild(t);
        }
        g.appendChild(naam);
        const ingr = Array.isArray(item.ingredients) ? item.ingredients.join(' | ') : (item.ingredients || '');
        if (ingr) {
          const p = document.createElement('div');
          p.className = 'ingredienten';
          p.textContent = ingr;
          g.appendChild(p);
        }
        blok.appendChild(g);
      }
      kolom.appendChild(blok);
    }
    cols.appendChild(kolom);
  });
</script>
</body>
</html>
