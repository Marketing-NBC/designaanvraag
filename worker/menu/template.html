<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Menuscherm</title>
<style>
  /* render.mjs zet hier de @font-face-regels neer voor precies de fonts die dit
     basisontwerp gebruikt, met het bestand als data-URI: about:blank mag geen
     file:// laden. */
{{FONTS}}

  * { margin: 0; padding: 0; }
  html, body { width: 3840px; height: 2160px; background: #ffffff; overflow: hidden; }
  svg { display: block; }
  text { white-space: pre; }
</style>
</head>
<body>
<svg id="doek" width="3840" height="2160" viewBox="0 0 3840 2160" xmlns="http://www.w3.org/2000/svg">
  <!-- De achtergrond komt rechtstreeks uit het .ai-bestand: de blobs zijn niet nagebouwd. -->
  <image id="achtergrond" x="0" y="0" width="3840" height="2160" preserveAspectRatio="none"/>
  <g id="logobalk"></g>
  <g id="titel"></g>
  <g id="inhoud"></g>
  <g id="voet"></g>
</svg>

<script>
(() => {
  const gegevens = window.__MENU__ || {}
  const basis = gegevens.basis
  const inhoud = gegevens.inhoud || {}
  const merk = gegevens.merk || {}
  const bibliotheek = gegevens.bibliotheek || {}
  const bekendeGerechten = bibliotheek.gerechten || {}
  const bekendeAlineas = bibliotheek.alineas || {}
  const SVG = 'http://www.w3.org/2000/svg'

  const meldingen = { botsingen: [], overloop: [], structuur: [], regelval: [], opmaak: [] }
  window.__RESULTAAT__ = meldingen

  const el = (naam, attrs = {}) => {
    const e = document.createElementNS(SVG, naam)
    for (const [k, v] of Object.entries(attrs)) if (v != null) e.setAttribute(k, v)
    return e
  }

  // ---------------------------------------------------------------- meten

  const meetDoek = document.createElement('canvas').getContext('2d')
  const meetCache = new Map()

  /** Breedte van een stuk tekst in hetzelfde font en corps als waarin het getekend wordt. */
  function breedte(tekst, font, grootte) {
    const sleutel = font + '|' + grootte + '|' + tekst
    let w = meetCache.get(sleutel)
    if (w === undefined) {
      meetDoek.font = `${grootte}px "${font}"`
      w = meetDoek.measureText(tekst).width
      meetCache.set(sleutel, w)
    }
    return w
  }

  /**
   * Breekt tekst af binnen een kaderbreedte.
   * Ingredienten worden gescheiden door " | "; zo'n onderdeel blijft altijd heel,
   * precies zoals in het basisontwerp. Losse woorden breken alleen als het moet.
   */
  function afbreken(tekst, font, grootte, kader) {
    const delen = tekst.split(/\s+/).filter(Boolean)
    const regels = []
    let huidig = ''
    for (const deel of delen) {
      const kandidaat = huidig ? huidig + ' ' + deel : deel
      if (huidig && breedte(kandidaat, font, grootte) > kader) {
        regels.push(huidig)
        huidig = deel
      } else {
        huidig = kandidaat
      }
    }
    if (huidig) regels.push(huidig)
    return regels.length ? regels : ['']
  }

  // ------------------------------------------------- basis -> inhoudsmodel

  /**
   * De sectie-indeling komt uit het bevroren basisontwerp: welke alinea de kop is
   * en welke alinea's bij welk gerecht horen. De renderer leidt dat niet zelf af.
   */
  function sectiesVan(kolom) {
    return kolom.secties.map((s) => ({
      kop: s.kopAlinea == null ? null : kolom.alineas[s.kopAlinea],
      gerechten: s.gerechten.map((g) => ({
        naam: kolom.alineas[g.naamAlinea],
        ingr: g.ingrAlinea == null ? null : kolom.alineas[g.ingrAlinea],
      })),
    }))
  }

  /** De secties uit de invoer, plat over alle kolommen heen. */
  function invoersecties() {
    const lijst = inhoud.secties
    return Array.isArray(lijst) ? lijst : null
  }

  // ------------------------------------------------------------ opmaken

  /**
   * Twee teksten zijn "dezelfde inhoud" als alleen de scheidingstekens anders
   * staan. Het basisontwerp bevat daar twee onregelmatigheden in: ergens staat
   * "vijgen| spruitjes" zonder spatie, en een paar regels eindigen op een losse
   * "|" die er is blijven staan. Dat zijn zetfouten in het ontwerp, geen andere
   * inhoud - zonder deze normalisatie zou zoiets de hele regelval laten
   * verspringen. Wat er getekend wordt blijft wel letterlijk het basisontwerp.
   */
  // tekstsleutel, gerechtsleutel en zoekGerecht komen uit menu/gerecht-match.mjs;
  // render.mjs zet dat bestand als script boven dit script in de pagina.
  function zelfdeInhoud(a, b) {
    return tekstsleutel(a) === tekstsleutel(b)
  }

  /**
   * Zoekt op hoe dit hele gerecht in de basisontwerpen gezet is.
   *
   * NBC werkt met een vast repertoire: hetzelfde gerecht komt in meerdere
   * pakketten terug. Staat het in een ontwerp, dan is dat de manier waarop het
   * hoort te staan - inclusief waar de naam ophoudt en waar de regels afbreken.
   * Dat weegt zwaarder dan onze eigen afbreking, die alleen op kaderbreedte kijkt.
   *
   * De tekst komt binnen zoals de traiteur hem opschrijft, dus zoekGerecht laat
   * een andere bewoording, een andere volgorde en een tikfout toe. Een gerecht
   * waar een woord uit het ontwerp ontbreekt is een ander gerecht; zie
   * menu/gerecht-match.mjs voor waarom dat zo streng moet.
   */
  function uitGerechtenbibliotheek(naam, ingredienten, grootte) {
    const geheel = [naam, ingredienten].filter(Boolean).join(' | ')
    const gevonden = zoekGerecht(geheel, bekendeGerechten, grootte)
    if (!gevonden) return null
    if (!gevonden.letterlijk) {
      // Wat er op het scherm komt is nu de tekst van de ontwerper en niet die van
      // de invuller. Dat hoort zo, maar Marketing moet het wel kunnen nakijken.
      const gezet = [gevonden.gerecht.naam, ...gevonden.gerecht.ingredienten].join(' | ')
      meldingen.opmaak.push(`"${geheel}" is gezet zoals het in het basisontwerp `
        + `staat: "${gezet}".`)
    }
    return gevonden.gerecht
  }

  /**
   * Zoekt op hoe een losse naam of omschrijving gezet is. Vangnet voor het geval
   * alleen een deel van een gerecht terugkomt: "Burrata" staat in twee pakketten
   * met heel andere ingredienten, en hoort in allebei hetzelfde te breken.
   */
  function uitBibliotheek(soort, tekst, grootte) {
    return bekendeAlineas[`${soort}|${grootte}|${tekstsleutel(tekst)}`] ?? null
  }

  /**
   * Zet een opsomming met bullets: per onderdeel een bullet met de naam, en
   * daaronder desgewenst een cursieve toelichting.
   *
   * De maten komen uit opsommingStijl van het pakket. Die is afgeleid uit het
   * enige basisontwerp dat een opsomming heeft (Grab & Go) en meegeschaald naar
   * het corps van elk pakket, zodat een gerecht met bullets ook in een pakket
   * gezet kan worden waar het .ai-bestand er geen heeft.
   */
  function regelsVoorOpsomming(onderdelen, stijl, kader, ritme) {
    const regels = []
    const offsets = []
    const binnenKader = kader - stijl.inspring
    const naamAfstand = ritme.regelafstand.ingr ?? stijl.naam.grootte * 1.3
    let y = 0
    let eerste = true

    for (const onderdeel of onderdelen) {
      const naamRegels = afbreken(String(onderdeel.naam ?? ''), stijl.naam.font, stijl.naam.grootte, binnenKader)
      naamRegels.forEach((tekst, j) => {
        if (eerste) eerste = false
        else y += j === 0 ? stijl.naarBullet : naamAfstand
        const runs = []
        if (j === 0) runs.push({ tekst: stijl.bullet, x: 0, ...stijl.naam })
        runs.push({ tekst, x: stijl.inspring, ...stijl.naam })
        regels.push(runs)
        offsets.push(y)
      })

      const delen = Array.isArray(onderdeel.toelichting)
        ? onderdeel.toelichting
        : (onderdeel.toelichting ? [String(onderdeel.toelichting)] : [])
      const toelichting = delen.filter(Boolean).join(' | ')
      if (!toelichting || !stijl.toelichting) continue
      for (const tekst of afbreken(toelichting, stijl.toelichting.font, stijl.toelichting.grootte, binnenKader)) {
        y += stijl.naarToelichting
        regels.push([{ tekst, x: stijl.inspring, ...stijl.toelichting }])
        offsets.push(y)
      }
    }
    return { regels, offsets, uitBasis: false }
  }

  /** Twee opsommingen zijn dezelfde inhoud als elke naam en toelichting gelijk is. */
  function zelfdeOpsomming(a, b) {
    if (!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) return false
    return a.every((o, i) => zelfdeInhoud(o.naam, b[i].naam)
      && zelfdeInhoud((o.toelichting || []).join(' | '), (b[i].toelichting || []).join(' | ')))
  }

  /**
   * Bepaalt per alinea welke regels er komen te staan.
   *
   * Is de inhoud dezelfde als in het basisontwerp, dan nemen we de regelval daarvan
   * letterlijk over - dan is het resultaat per definitie identiek. Alleen als de
   * inhoud echt wijzigt, zetten we de alinea zelf opnieuw binnen het kader.
   *
   * vasteRegels is de regelval die de gerechtenbibliotheek voor deze alinea gaf;
   * die komt uit een ontwerp waar dit hele gerecht in staat en gaat dus voor op
   * wat we per losse alinea zouden vinden.
   */
  function regelsVoor(alinea, nieuw, kader, ritme, vasteRegels) {
    const opsommingStijl = basis.opsommingStijl
    const nieuweOnderdelen = nieuw && nieuw.onderdelen
    const nieuweTekst = nieuw && nieuw.tekst

    const gelijk = nieuweOnderdelen
      ? zelfdeOpsomming(nieuweOnderdelen, alinea.onderdelen)
      : (nieuweTekst == null || zelfdeInhoud(nieuweTekst, alinea.tekst))

    if (gelijk && !gegevens.forceerHerberekening) {
      // Ook de onderlinge regelafstanden komen letterlijk uit het basisontwerp;
      // in een opsomming wisselen die per regel, en dat hoort zo.
      const nul = alinea.regels[0].baseline
      return {
        regels: alinea.regels.map((r) => r.runs),
        offsets: alinea.regels.map((r) => r.baseline - nul),
        uitBasis: true,
      }
    }

    // Een opsomming: uit de aangeleverde onderdelen, of anders die van het ontwerp.
    const onderdelen = nieuweOnderdelen
      || (nieuweTekst == null && alinea.soort === 'opsomming' ? alinea.onderdelen : null)
    if (onderdelen && opsommingStijl) {
      return regelsVoorOpsomming(onderdelen, opsommingStijl, kader, ritme)
    }

    // Gewone lopende tekst. Bij een alinea die in het ontwerp een opsomming was,
    // pakken we de ingredientenstijl van het pakket: de eerste run is daar de
    // bullet, en die heeft een eigen kleur.
    const stijl = alinea.soort === 'opsomming'
      ? (basis.stijl.ingr || alinea.regels[0].runs[0])
      : alinea.regels[0].runs[0]
    const tekst = nieuweTekst ?? alinea.tekst
    const afstand = regelafstand(alinea, ritme)

    // Staat deze tekst in een basisontwerp? Dan zetten we hem zoals daar, ook als
    // hij uit een ander pakket komt. Eerst het hele gerecht, dan de losse alinea.
    //
    // Bij forceerHerberekening slaan we de bibliotheek over: die stand toetst juist
    // of onze eigen afbreking op dezelfde regels uitkomt als de ontwerper. Zou de
    // bibliotheek daar meedoen, dan bewees die controle niets meer.
    const bekend = gegevens.forceerHerberekening
      ? null
      : (vasteRegels
        ?? uitBibliotheek(alinea.soort === 'opsomming' ? 'ingr' : alinea.soort,
                          tekst, stijl.grootte)?.regels)
    // stijl.x is de inspring die de alinea in het ontwerp heeft - vaak een fractie
    // van een pixel, maar zonder die inspring staat een herzette regel net niet
    // waar de ontwerper hem zette.
    const zetRegel = (t) => [{ tekst: t, x: stijl.x ?? 0, font: stijl.font,
                               grootte: stijl.grootte, kleur: stijl.kleur }]

    if (bekend) {
      return {
        regels: bekend.map((r) => zetRegel(r.tekst)),
        offsets: bekend.map((r) => r.offset),
        uitBasis: false,
        uitBibliotheek: true,
      }
    }

    const stukken = afbreken(tekst, stijl.font, stijl.grootte, kader)
    return {
      regels: stukken.map(zetRegel),
      offsets: stukken.map((_, i) => i * afstand),
      uitBasis: false,
    }
  }

  /**
   * Een alinea die het basisontwerp niet heeft: een extra gerecht, of een
   * omschrijving bij een gerecht dat er in het ontwerp geen had. Hij heeft alleen
   * de stijl van het pakket; zijn plek komt uit het ritme, want er is geen
   * baseline uit het ontwerp om op terug te vallen.
   */
  function maakAlinea(soort) {
    const stijl = basis.stijl[soort] ?? basis.stijl.ingr
    return {
      soort,
      tekst: '',
      buitenOntwerp: true,
      regels: [{ baseline: 0, runs: [{ tekst: '', x: 0, ...stijl }] }],
    }
  }

  /** Regelafstand binnen een alinea: uit het basisontwerp, anders uit het ritme. */
  function regelafstand(alinea, ritme) {
    if (alinea.regels.length > 1) {
      return alinea.regels[1].baseline - alinea.regels[0].baseline
    }
    return ritme.regelafstand[alinea.soort] ?? alinea.regels[0].runs[0].grootte * 1.2
  }

  /**
   * De sprong van de vorige alinea naar deze.
   * Zolang de opbouw gelijk is aan het basisontwerp nemen we de afstand letterlijk
   * over - inclusief de handmatige correcties die de ontwerper heeft gemaakt.
   * Wijkt de opbouw af, dan valt hij terug op het vaste ritme van het pakket.
   */
  function sprong(vorige, deze, ritme, structuurGewijzigd) {
    const letterlijk = deze.regels[0].baseline - vorige.regels[vorige.regels.length - 1].baseline
    if (!structuurGewijzigd) return letterlijk

    const uitRitme = ritme.overgang[`${vorige.soort}->${deze.soort}`]
    if (uitRitme != null) return uitRitme

    // Deze overgang staat niet in het ritme. Dat gebeurt zodra er iets opduikt wat
    // in geen enkel basisontwerp staat: een gerecht zonder ingredienten gevolgd
    // door een nieuwe gang, bijvoorbeeld. De afstand tot een kop is optisch
    // dezelfde, wat eraan voorafging ook - dus nemen we de overgang naar hetzelfde
    // soort alinea die het ritme wel kent.
    for (const [naam, waarde] of Object.entries(ritme.overgang)) {
      if (naam.endsWith(`->${deze.soort}`)) return waarde
    }
    // Als laatste redmiddel de letterlijke afstand, maar alleen als die vooruit
    // wijst: bij een sectie die naar een andere kolom is verhuisd komen de twee
    // baselines uit verschillende kolommen en is het verschil negatief.
    return letterlijk > 0 ? letterlijk : deze.regels[0].runs[0].grootte * 1.6
  }

  // ------------------------------------------------------------ tekenen

  /** De sectiekoppen staan in het accent van de huisstijl; die mag per klant wisselen. */
  const kopKleur = (basis.stijl && basis.stijl.kop && basis.stijl.kop.kleur) || '#f6a107'
  const kleurVan = (run) => (merk.accent && run.kleur === kopKleur ? merk.accent : run.kleur)

  /**
   * Waar deze regel komt te staan, zonder hem te tekenen. De engine probeert
   * meerdere verdelingen over de kolommen voordat hij er een kiest, en alleen de
   * gekozen verdeling wordt getekend.
   *
   * De rechterrand is de verste run, niet de som van de breedtes: in een
   * opsomming staat de bullet los van de tekst ernaast, en met optellen zou de
   * regel smaller lijken dan hij is. Daar hangt de blob-controle op.
   */
  function meetRegel(runs, x, baseline) {
    let x0 = Infinity
    let x1 = -Infinity
    let loopend = x
    for (const run of runs) {
      const start = run.x ? x + run.x : loopend
      const eind = start + breedte(run.tekst, run.font, run.grootte)
      x0 = Math.min(x0, start)
      x1 = Math.max(x1, eind)
      loopend = eind
    }
    return { x0, x1, baseline, grootte: runs[0].grootte }
  }

  function tekenRegel(groep, runs, x, baseline) {
    const t = el('text', { x, y: baseline })
    for (const run of runs) {
      const span = el('tspan', {
        x: run.x ? x + run.x : null,
        'font-family': run.font,
        'font-size': run.grootte,
        fill: kleurVan(run),
      })
      span.textContent = run.tekst
      t.appendChild(span)
    }
    groep.appendChild(t)
    return meetRegel(runs, x, baseline)
  }

  // ------------------------------------------------------- blob-verbod

  const NBC_BOVEN = [246, 161, 7]     // oranje, bovenin de blobs
  const NBC_ONDER = [34, 157, 150]    // teal, onderin de blobs

  const naarRgb = (h) => {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(h || ''))
    if (!m) return null
    const n = parseInt(m[1], 16)
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255]
  }

  /**
   * Geeft de blobs de kleuren van de opdrachtgever, zonder de vorm aan te raken.
   *
   * Elke blobpixel is een mengsel van wit, het oranje en het teal uit de huisstijl:
   *   pixel = wit + u*(oranje - wit) + v*(teal - oranje)
   * Door u en v terug te rekenen weten we hoe dekkend de pixel is en waar hij in
   * het verloop zit; met dezelfde u en v bouwen we hem opnieuw op in de twee
   * nieuwe kleuren. Vorm, verloop en randen blijven daardoor exact zoals in het
   * Illustrator-bestand - alleen de kleur verschuift.
   */
  function hertint(px, boven, onder) {
    const m1 = [NBC_BOVEN[0] - 255, NBC_BOVEN[1] - 255, NBC_BOVEN[2] - 255]
    const m2 = [NBC_ONDER[0] - NBC_BOVEN[0], NBC_ONDER[1] - NBC_BOVEN[1], NBC_ONDER[2] - NBC_BOVEN[2]]
    const n1 = [boven[0] - 255, boven[1] - 255, boven[2] - 255]
    const n2 = [onder[0] - boven[0], onder[1] - boven[1], onder[2] - boven[2]]
    const a = m1[0] * m1[0] + m1[1] * m1[1] + m1[2] * m1[2]
    const b = m1[0] * m2[0] + m1[1] * m2[1] + m1[2] * m2[2]
    const d = m2[0] * m2[0] + m2[1] * m2[1] + m2[2] * m2[2]
    const det = a * d - b * b
    if (!det) return
    for (let i = 0; i < px.length; i += 4) {
      const r = px[i] - 255, g = px[i + 1] - 255, bl = px[i + 2] - 255
      if (r > -6 && g > -6 && bl > -6) continue        // wit: geen blob
      const p = m1[0] * r + m1[1] * g + m1[2] * bl
      const q = m2[0] * r + m2[1] * g + m2[2] * bl
      const u = (d * p - b * q) / det
      const v = (a * q - b * p) / det
      px[i] = Math.max(0, Math.min(255, Math.round(255 + u * n1[0] + v * n2[0])))
      px[i + 1] = Math.max(0, Math.min(255, Math.round(255 + u * n1[1] + v * n2[1])))
      px[i + 2] = Math.max(0, Math.min(255, Math.round(255 + u * n1[2] + v * n2[2])))
    }
  }

  /**
   * Leest de achtergrond uit en bepaalt per beeldrij waar de blobs beginnen.
   * De regel is hard: er mag nooit tekst over een blob vallen.
   * Meteen ook de plek om de blobs te herkleuren, want de pixels liggen hier al klaar.
   */
  function achtergrondVerwerken(afbeelding) {
    const B = 3840, H = 2160
    const c = document.createElement('canvas')
    c.width = B; c.height = H
    const ctx = c.getContext('2d', { willReadFrequently: true })
    ctx.drawImage(afbeelding, 0, 0, B, H)
    const beeld = ctx.getImageData(0, 0, B, H)
    const px = beeld.data

    const boven = naarRgb(merk.blobBoven)
    const onder = naarRgb(merk.blobOnder)
    if (boven && onder) {
      hertint(px, boven, onder)
      ctx.putImageData(beeld, 0, 0)
      document.getElementById('achtergrond').setAttribute('href', c.toDataURL('image/png'))
    }

    const rechts = new Int32Array(H).fill(B)   // linkerrand van de rechter blob
    const links = new Int32Array(H).fill(-1)   // rechterrand van de linker blob
    for (let y = 0; y < H; y++) {
      const rij = y * B * 4
      for (let x = 0; x < B; x++) {
        const i = rij + x * 4
        const gekleurd = px[i] < 243 || px[i + 1] < 243 || px[i + 2] < 243
        if (!gekleurd) continue
        if (x > B / 2) { if (x < rechts[y]) rechts[y] = x }
        else if (x > links[y]) links[y] = x
      }
    }
    return { rechts, links }
  }

  /**
   * De vaste onderdelen van het scherm waar de menutekst niet overheen mag: de
   * logobalk van de opdrachtgever en de dieetwens-regel met het bestek-icoon.
   * Die staan niet in de achtergrond, dus de blob-controle ziet ze niet - en juist
   * de voetregel komt in beeld zodra een kolom langer wordt dan in het ontwerp.
   */
  function verbodenVlakken() {
    const vlakken = []
    const lb = basis.logobalk
    if (lb) {
      vlakken.push({ naam: 'de logobalk', x0: lb.x, y0: lb.y,
                     x1: lb.x + lb.breedte, y1: lb.y + lb.hoogte })
    }
    const voet = basis.voetregel
    if (voet) {
      let x0 = Infinity; let y0 = Infinity; let x1 = -Infinity; let y1 = -Infinity
      if (voet.icoon) {
        x0 = Math.min(x0, voet.icoon.x); y0 = Math.min(y0, voet.icoon.y)
        x1 = Math.max(x1, voet.icoon.x + voet.icoon.breedte)
        y1 = Math.max(y1, voet.icoon.y + voet.icoon.hoogte)
      }
      for (const regel of voet.regels ?? []) {
        x0 = Math.min(x0, regel.x)
        y0 = Math.min(y0, regel.baseline - regel.grootte)
        x1 = Math.max(x1, regel.x + breedte(regel.tekst, regel.font, regel.grootte))
        y1 = Math.max(y1, regel.baseline + regel.grootte * 0.3)
      }
      if (Number.isFinite(x0)) vlakken.push({ naam: 'de dieetwens-regel', x0, y0, x1, y1 })
    }
    return vlakken
  }

  /**
   * Raakt deze regel iets wat vrij hoort te blijven? Geeft terug wat er geraakt
   * wordt ('een blob', 'de dieetwens-regel', ...) of null.
   */
  function raaktIets(grenzen, vlakken, vak) {
    const boven = Math.max(0, Math.round(vak.baseline - vak.grootte))
    const onder = Math.min(2159, Math.round(vak.baseline + vak.grootte * 0.3))

    if (grenzen) {
      for (let y = boven; y <= onder; y++) {
        if (vak.x1 > grenzen.rechts[y] || vak.x0 < grenzen.links[y]) return 'een blob'
      }
    }
    for (const vlak of vlakken) {
      if (vak.x1 > vlak.x0 && vak.x0 < vlak.x1 && onder > vlak.y0 && boven < vlak.y1) return vlak.naam
    }
    return null
  }

  /**
   * Kiest hoe de secties over de kolommen verdeeld worden.
   *
   * De verdeling uit het basisontwerp gaat voor: past die, dan komt het ontwerp er
   * ongewijzigd uit. Past hij niet, dan schuift er zo min mogelijk op - een gang
   * naar de kolom ernaast, en pas als dat niet helpt verder. Past geen enkele
   * verdeling, dan houden we die van het ontwerp aan en blijft de botsing staan:
   * dan is het menu echt te lang, en dat hoort gemeld te worden, niet verstopt.
   */
  function kiesVerdeling(namen, aantalKolommen, basisKolom, legUit) {
    const aantalSecties = namen.length
    // Elke verdeling is niet-dalend: de gangen blijven in leesvolgorde staan.
    const verdelingen = []
    const bouwOp = (rij, kolom) => {
      if (rij.length === aantalSecties) { verdelingen.push(rij.slice()); return }
      for (let k = kolom; k < aantalKolommen; k++) bouwOp([...rij, k], k)
    }
    bouwOp([], 0)

    // Eerst zo dicht mogelijk bij het basisontwerp. Schuiven er evenveel gangen op,
    // dan die verdeling die de linkerkolommen het eerst vult - zoals je leest, en
    // zoals Abel het op pagina 10 zelf oploste: het Voorgerecht een kolom naar
    // links in plaats van het Hoofdgerecht naar de smalle kolom rechts.
    const afstand = (v) => v.reduce((n, k, i) => n + Math.abs(k - (basisKolom[i] ?? k)), 0)
    const vergelijk = (a, b) => {
      const verschil = afstand(a) - afstand(b)
      if (verschil !== 0) return verschil
      for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] - b[i]
      return 0
    }
    verdelingen.sort(vergelijk)

    let eerste = null
    for (const verdeling of verdelingen) {
      const uit = legUit(verdeling)
      if (!eerste) eerste = { ...uit, verdeling }
      if (!uit.botsingen.length && !uit.overloop.length) {
        const verschoven = verdeling
          .map((k, i) => (k === basisKolom[i] ? null : `"${namen[i] || `sectie ${i + 1}`}"`))
          .filter(Boolean)
        return { ...uit, verdeling, verschoven }
      }
    }
    return { ...eerste, verschoven: [] }
  }

  // ------------------------------------------------------------- opbouw

  function bouw(grenzen) {
    const doek = document.getElementById('doek')

    // --- titel
    const titelGroep = document.getElementById('titel')
    const tb = basis.titel
    if (tb && tb.tekst) {
      const tekst = inhoud.titel || tb.tekst
      const t = el('text', { x: tb.x, y: tb.baseline, 'font-family': tb.font,
                             'font-size': tb.grootte, fill: merk.tekstkleur || tb.kleur })
      t.textContent = tekst
      titelGroep.appendChild(t)
    }

    // --- logobalk van de opdrachtgever
    const lb = basis.logobalk
    const logoGroep = document.getElementById('logobalk')
    if (lb) {
      if (merk.logo) {
        logoGroep.appendChild(el('rect', { x: lb.x, y: lb.y, width: lb.breedte, height: lb.hoogte,
                                           fill: merk.logoAchtergrond || '#ffffff' }))
        logoGroep.appendChild(el('image', {
          href: merk.logo, x: lb.x + lb.breedte * 0.06, y: lb.y + lb.hoogte * 0.09,
          width: lb.breedte * 0.88, height: lb.hoogte * 0.82,
          preserveAspectRatio: 'xMidYMid meet',
        }))
      } else {
        logoGroep.appendChild(el('rect', { x: lb.x, y: lb.y, width: lb.breedte, height: lb.hoogte,
                                           fill: lb.vulkleur }))
        const p = lb.plaatshouder
        const t = el('text', { x: p.x, y: p.baseline, 'font-family': p.font,
                               'font-size': p.grootte, fill: '#000000' })
        t.textContent = p.tekst
        logoGroep.appendChild(t)
      }
    }

    // --- voetregel: bestek-icoon plus de vaste dieetwens-tekst
    const voet = document.getElementById('voet')
    const vi = basis.voetregel && basis.voetregel.icoon
    if (vi) {
      const accent = merk.accent || vi.kleur
      const g = el('g', {
        transform: `translate(${vi.x} ${vi.y}) scale(${vi.breedte / 314.38} ${vi.hoogte / 204.21})`,
        fill: accent,
      })
      g.innerHTML = window.__ICOON__
      voet.appendChild(g)
    }
    for (const regel of (basis.voetregel ? basis.voetregel.regels : [])) {
      const t = el('text', { x: regel.x, y: regel.baseline, 'font-family': regel.font,
                             'font-size': regel.grootte, fill: regel.kleur })
      t.textContent = regel.tekst
      voet.appendChild(t)
    }

    // --- de menu-inhoud
    //
    // De gangen staan niet vast aan een kolom. Ze lopen door, zoals tekst door
    // gekoppelde kaders loopt: elke kolom begint bovenaan, en een gang die er niet
    // meer bij past begint in de volgende. Het basisontwerp bepaalt waar de
    // kolomovergangen bij voorkeur vallen; pas als de inhoud daar niet in past
    // schuift er een gang op. Zo komt een ongewijzigd ontwerp er 1:1 uit, en past
    // een langer menu zich aan zonder dat het ontwerp verandert.
    const vlakken = verbodenVlakken()
    const inhoudGroep = document.getElementById('inhoud')
    const ritme = basis.ritme
    const nieuweSecties = invoersecties()

    // De secties van het basisontwerp, in leesvolgorde over de kolommen heen, en
    // per kolom de bovenkant waar de eerste gang begint.
    const kolomSecties = basis.kolommen.map(sectiesVan)
    const alleBasisSecties = kolomSecties.flat()
    const kolomTop = basis.kolommen.map(
      (k) => Math.min(...k.alineas.flatMap((a) => a.regels.map((r) => r.baseline))))
    // De kolom waar elke sectie in het basisontwerp staat.
    const basisKolom = kolomSecties.flatMap((secties, ki) => secties.map(() => ki))

    if (nieuweSecties && nieuweSecties.length !== alleBasisSecties.length) {
      meldingen.structuur.push(
        `Het basisontwerp "${basis.pakket}" heeft ${alleBasisSecties.length} secties, ` +
        `de aangeleverde inhoud ${nieuweSecties.length}.`)
    }

    // Per sectie de alinea's die erin komen, op volgorde. Dit hangt niet van de
    // kolom af, dus het gebeurt een keer - ook de opzoekingen in de bibliotheek,
    // die anders bij elke poging opnieuw zouden melden.
    const secties = alleBasisSecties.map((sectie, si) => {
      const nieuw = nieuweSecties ? nieuweSecties[si] : null
      const taken = []
      if (sectie.kop) taken.push({ alinea: sectie.kop, nieuw: nieuw ? { tekst: nieuw.kop } : null })

      // Zodra er inhoud is aangeleverd, bepaalt die wat er op het scherm komt.
      // Het basisontwerp levert alleen de plek en de stijl. Een gerecht uit het
      // ontwerp dat niet is aangeleverd valt weg - anders zou er een gerecht op
      // het scherm staan dat de opdrachtgever niet heeft besteld.
      const bronGerechten = nieuw && Array.isArray(nieuw.gerechten) ? nieuw.gerechten : null
      const aantal = bronGerechten ? bronGerechten.length : sectie.gerechten.length

      for (let gi = 0; gi < aantal; gi++) {
        const bron = bronGerechten ? bronGerechten[gi] : null
        const uitOntwerp = sectie.gerechten[gi] ?? null
        const naamAlinea = uitOntwerp ? uitOntwerp.naam : maakAlinea('naam')

        // Een gerecht heeft ofwel een rij ingredienten, ofwel een opsomming met
        // bullets. Beide kunnen van het basisontwerp afwijken: een opsomming kan
        // naar een pakket verhuizen dat er geen had, en andersom.
        let omschrijving = null
        if (bron && Array.isArray(bron.onderdelen) && bron.onderdelen.length) {
          omschrijving = { onderdelen: bron.onderdelen }
        } else if (bron && bron.ingredienten && bron.ingredienten.length) {
          omschrijving = {
            tekst: Array.isArray(bron.ingredienten) ? bron.ingredienten.join(' | ') : String(bron.ingredienten),
          }
        }

        // Kennen we dit gerecht als geheel? Dan bepaalt het ontwerp waar het in
        // staat hoe het hier komt te staan: waar de naam ophoudt en waar de
        // regels afbreken. Een opsomming met bullets slaan we over - dat is een
        // eigen structuur en die staat niet in de bibliotheek.
        const bekend = bron && !(omschrijving && omschrijving.onderdelen)
          ? uitGerechtenbibliotheek(bron.naam, omschrijving ? omschrijving.tekst : '',
                                    naamAlinea.regels[0].runs[0].grootte)
          : null
        const gerechtNaam = (bekend && bekend.naam) || (bron && bron.naam)
          || (uitOntwerp ? uitOntwerp.naam.tekst : '')

        taken.push({ alinea: naamAlinea, nieuw: bron ? { tekst: bron.naam } : null,
                     buitenOntwerp: !uitOntwerp, gerechtNaam,
                     vasteRegels: bekend ? bekend.naamRegels : null })

        if (bronGerechten) {
          // Kent de bibliotheek dit gerecht met een omschrijving, dan hoort die
          // erbij - ook als hij in een adem met de naam is ingetypt. Zo staat
          // "dessertbuffet met zoete lekkernijen met L\'OR coffee popping pearls"
          // alsnog met de pearls op hun eigen regel, zoals in het ontwerp.
          const uitBibliotheek = bekend && bekend.ingrRegels ? bekend : null
          const omschrijvingOfBekend = omschrijving
            ?? (uitBibliotheek ? { tekst: uitBibliotheek.ingredienten.join(' | ') } : null)
          // Verder geldt: geen omschrijving aangeleverd, dan komt er ook geen te staan.
          if (omschrijvingOfBekend) {
            const alinea = (uitOntwerp && uitOntwerp.ingr) || maakAlinea('ingr')
            taken.push({ alinea, nieuw: omschrijvingOfBekend, gerechtNaam,
                         buitenOntwerp: !(uitOntwerp && uitOntwerp.ingr),
                         vasteRegels: bekend ? bekend.ingrRegels : null })
          }
        } else if (uitOntwerp && uitOntwerp.ingr) {
          taken.push({ alinea: uitOntwerp.ingr, nieuw: null, gerechtNaam })
        }
      }

      if (bronGerechten && bronGerechten.length !== sectie.gerechten.length) {
        meldingen.structuur.push(
          `Sectie "${sectie.kop ? sectie.kop.tekst : '(zonder kop)'}" heeft `
          + `${sectie.gerechten.length} gerechten in het basisontwerp, `
          + `${bronGerechten.length} in de aangeleverde inhoud.`)
      }

      // Waar deze regels bij horen, zodat een botsing zegt welke gang te lang is
      // en niet alleen welk stukje tekst eroverheen valt.
      return { taken, naam: nieuw?.kop || (sectie.kop ? sectie.kop.tekst : '') }
    })

    /**
     * Zet alle secties op hun plek volgens `verdeling` (per sectie de kolom),
     * zonder iets te tekenen. Geeft de regels terug, plus wat eraan mankeert.
     */
    function legUit(verdeling) {
      const regels = []
      const botsingen = []
      const overloop = []
      const praat = []
      for (let ki = 0; ki < basis.kolommen.length; ki++) {
        const kolom = basis.kolommen[ki]
        const kader = kolom.kader.breedte
        let vorigeAlinea = null
        let vorigeBaseline = null

        // Staan in deze kolom precies de secties die het basisontwerp er zette, in
        // dezelfde volgorde? Dan gelden de baselines uit het ontwerp en komt de
        // kolom er letterlijk zo uit. Zodra er iets verschoven is - ook als een
        // sectie in zijn eigen kolom blijft maar er de eerste wordt - klopt geen
        // enkele baseline uit het ontwerp meer en telt het ritme van het pakket.
        const hier = []
        const uitOntwerp = []
        for (let si = 0; si < secties.length; si++) {
          if (verdeling[si] === ki) hier.push(si)
          if (basisKolom[si] === ki) uitOntwerp.push(si)
        }
        const zelfdeAlsOntwerp = hier.length === uitOntwerp.length
          && hier.every((si, i) => si === uitOntwerp[i])
        let structuurGewijzigd = !zelfdeAlsOntwerp

        for (const si of hier) {

          for (const taak of secties[si].taken) {
            const { alinea, nieuw: nieuweInhoud } = taak
            if (taak.buitenOntwerp) structuurGewijzigd = true
            const uitkomst = regelsVoor(alinea, nieuweInhoud, kader, ritme, taak.vasteRegels)
            const { regels: stukken, offsets, uitBasis, uitBibliotheek: viaBibliotheek } = uitkomst
            if (!uitBasis) {
              structuurGewijzigd = structuurGewijzigd || stukken.length !== alinea.regels.length
              const kort = ((nieuweInhoud && nieuweInhoud.tekst) ?? alinea.tekst).slice(0, 40)
              const wasOpsomming = alinea.soort === 'opsomming'
              const wordtOpsomming = Boolean(nieuweInhoud && nieuweInhoud.onderdelen)
              if (wasOpsomming && !wordtOpsomming && nieuweInhoud) {
                praat.push(['opmaak',
                  `"${kort}" staat in het basisontwerp als opsomming met bullets, `
                  + 'maar is aangeleverd als gewone rij ingredienten. Lever "onderdelen" aan '
                  + 'als de bullets moeten blijven.'])
              } else if (!wasOpsomming && wordtOpsomming) {
                praat.push(['opmaak',
                  `"${kort}" wordt als opsomming met bullets gezet terwijl het `
                  + 'basisontwerp daar gewone ingredienten had. Kijk dit scherm even na.'])
              } else if (viaBibliotheek) {
                // De regelval komt uit een basisontwerp waar deze tekst al in staat.
                // Dat is geen afwijking maar juist de bedoeling; niets te melden.
              } else if (stukken.length !== alinea.regels.length) {
                praat.push(['regelval',
                  `"${kort}" valt over ${stukken.length} regels, `
                  + `het basisontwerp had er ${alinea.regels.length}.`])
              }
            }

            let baseline
            if (vorigeAlinea === null) {
              // Bovenaan de kolom: de baseline uit het ontwerp als deze kolom
              // onveranderd is, anders de bovenkant waar elke kolom begint.
              baseline = zelfdeAlsOntwerp ? alinea.regels[0].baseline : kolomTop[ki]
            } else {
              baseline = vorigeBaseline + sprong(vorigeAlinea, alinea, ritme, structuurGewijzigd)
            }

            stukken.forEach((runs, i) => {
              const y = baseline + offsets[i]
              const vak = meetRegel(runs, kolom.x, y)
              const tekst = runs.map((r) => r.tekst).join('')
              regels.push({ runs, x: kolom.x, y, vak, tekst,
                            waarbij: { sectie: secties[si].naam, gerecht: taak.gerechtNaam } })
              const raakt = raaktIets(grenzen, vlakken, vak)
              if (raakt) botsingen.push({ tekst, waar: raakt, baseline: y, ...vak,
                                          ...{ sectie: secties[si].naam, gerecht: taak.gerechtNaam } })
              if (y > 2160 - 40) overloop.push(`"${tekst.slice(0, 40)}" valt onder de onderrand van het scherm.`)
            })

            vorigeAlinea = alinea
            vorigeBaseline = baseline + offsets[offsets.length - 1]
          }
        }
      }
      return { regels, botsingen, overloop, praat }
    }

    // Alle manieren om de secties op volgorde over de kolommen te verdelen, met de
    // verdeling uit het basisontwerp vooraan. Die van het ontwerp wint dus altijd
    // als hij past; anders schuift er zo min mogelijk op.
    const uitkomst = kiesVerdeling(secties.map((s) => s.naam), basis.kolommen.length,
                                   basisKolom, legUit)
    for (const [soort, tekst] of uitkomst.praat) meldingen[soort].push(tekst)
    for (const b of uitkomst.botsingen) meldingen.botsingen.push(b)
    for (const t of uitkomst.overloop) meldingen.overloop.push(t)
    if (uitkomst.verschoven.length) {
      meldingen.opmaak.push(`De inhoud paste niet in de kolommen van het basisontwerp; `
        + `${uitkomst.verschoven.join(' en ')} ${uitkomst.verschoven.length === 1 ? 'staat' : 'staan'} `
        + 'nu in een andere kolom.')
    }
    for (const r of uitkomst.regels) tekenRegel(inhoudGroep, r.runs, r.x, r.y)

    // De uitkomst zelf, zodat een test kan nakijken welke gang in welke kolom
    // staat en op welke baseline. Zonder dit kun je alleen naar pixels kijken.
    window.__OPMAAK__ = {
      verdeling: uitkomst.verdeling,
      regels: uitkomst.regels.map((r) => ({ x: r.x, baseline: Math.round(r.y * 100) / 100,
                                            sectie: r.waarbij.sectie, tekst: r.tekst })),
    }
  }

  // ------------------------------------------------------------- starten

  const achtergrond = document.getElementById('achtergrond')
  const klaar = new Promise((resolve) => {
    if (!gegevens.achtergrond) return resolve(null)
    const img = new Image()
    img.onload = () => resolve(img)
    img.onerror = () => resolve(null)
    img.src = gegevens.achtergrond
    achtergrond.setAttribute('href', gegevens.achtergrond)
  })

  /**
   * Alle font-en-corps-combinaties die dit basisontwerp gebruikt.
   * Nodig omdat ze expliciet geladen moeten worden voordat er iets gemeten wordt.
   */
  function fontspecs() {
    const specs = new Set()
    const zet = (o) => { if (o && o.font && o.grootte) specs.add(`${o.grootte}px "${o.font}"`) }
    zet(basis.titel)
    if (basis.logobalk) zet(basis.logobalk.plaatshouder)
    for (const r of (basis.voetregel ? basis.voetregel.regels : [])) zet(r)
    for (const kolom of basis.kolommen) {
      for (const alinea of kolom.alineas) {
        for (const regel of alinea.regels) for (const run of regel.runs) zet(run)
      }
    }
    return [...specs]
  }

  /**
   * Laadt elk gebruikt font expliciet.
   *
   * document.fonts.ready is hier niet genoeg: een @font-face die nog nergens in
   * de DOM gebruikt is, wordt door de browser niet geladen, en dan meet canvas
   * measureText stilletjes in een vervangend font. Dat scheelde in de praktijk
   * 20% in breedte - genoeg om regels verkeerd af te breken en om tekst over een
   * blob te laten lopen zonder dat de controle aansloeg.
   */
  async function fontsLaden() {
    const specs = fontspecs()
    await Promise.all(specs.map((s) => document.fonts.load(s).catch(() => {})))
    await document.fonts.ready
    const missend = specs.filter((s) => !document.fonts.check(s))
    if (missend.length) {
      meldingen.structuur.push(`Deze fonts konden niet geladen worden: ${missend.join(', ')}. `
        + 'Alles wat gemeten wordt klopt dan niet.')
    }
  }

  window.__KLAAR__ = (async () => {
    const img = await klaar
    await fontsLaden()
    const grenzen = img ? achtergrondVerwerken(img) : null
    bouw(grenzen)
    return meldingen
  })()
})()
</script>
</body>
</html>
